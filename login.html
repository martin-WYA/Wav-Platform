<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wavumbuzi - User Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #d8edf4;
            background-image: url('Blue sky with footer banner.jpg');
            background-size: cover;
            background-position: center bottom;
            background-repeat: no-repeat;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            margin: 0;
            align-items: flex-start;
            padding-left: max(20px, 8vw);
        }

        .main-container {
            width: 100%;
            max-width: 950px;
            padding: 20px 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            flex-grow: 1;
            z-index: 10;
            align-items: flex-start;
        }

        .reg-card {
            background-color: #f2f8fa;
            width: 100%;
            max-width: 800px;
            max-height: 83vh;
            /* Increased from 75vh to fill more window height */
            display: flex;
            flex-direction: column;
            border-radius: 20px;
            padding: 32px 48px 24px 48px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.08), 0 2px 10px rgba(0, 0, 0, 0.04);
            position: relative;
            border: 1px solid rgba(255, 255, 255, 0.8);
        }

        .school-name,
        .card-header,
        .search-container,
        .button-row,
        .missing-face-link {
            flex-shrink: 0;
        }

        .school-name {
            text-align: center;
            font-size: 12px;
            font-weight: 700;
            color: #64748b;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            margin-bottom: 12px;
        }

        .teacher-link {
            position: absolute;
            top: 16px;
            right: 20px;
            color: #e88524;
            font-weight: 700;
            font-size: 13px;
            text-decoration: underline;
            text-underline-offset: 3px;
            cursor: pointer;
            transition: color 0.2s;
        }

        .teacher-link:hover {
            color: #cf7015;
        }

        .card-header {
            text-align: center;
            margin-bottom: 24px;
        }

        .card-title {
            font-size: 32px;
            font-weight: 700;
            color: #111827;
            margin-bottom: 8px;
        }

        .card-desc {
            font-size: 15px;
            color: #4b5563;
            font-weight: 500;
        }

        .signup-link {
            color: #e88524;
            font-weight: 700;
            text-decoration: underline;
            text-underline-offset: 3px;
            transition: color 0.2s;
        }

        .signup-link:hover {
            color: #cf7015;
        }

        .search-container {
            width: 100%;
            position: relative;
            margin-bottom: 24px;
        }

        .search-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
        }

        .search-input {
            width: 100%;
            padding: 14px 16px 14px 44px;
            border: 1px solid #94a3b8;
            border-radius: 8px;
            font-size: 15px;
            color: #1f2937;
            background-color: #ffffff;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .search-input::placeholder {
            color: #94a3b8;
        }

        .search-input:focus {
            border-color: #e88524;
            box-shadow: 0 0 0 3px rgba(232, 133, 36, 0.15);
        }

        .grid-scroll-container {
            flex-grow: 1;
            min-height: 0;
            overflow-y: auto;
            padding: 4px;
            margin: 0 -4px;
            scrollbar-width: thin;
            scrollbar-color: #cbd5e1 transparent;
        }

        .grid-scroll-container::-webkit-scrollbar {
            width: 6px;
        }

        .grid-scroll-container::-webkit-scrollbar-track {
            background: transparent;
        }

        .grid-scroll-container::-webkit-scrollbar-thumb {
            background-color: #cbd5e1;
            border-radius: 10px;
        }

        .avatar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 12px;
            padding-bottom: 8px;
        }

        .avatar-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            transition: transform 0.15s ease;
            position: relative;
        }

        .avatar-card:hover:not(.selected) {
            transform: translateY(-2px);
        }

        .badge-new {
            position: absolute;
            top: -6px;
            right: 2px;
            background-color: #ef4444;
            color: #ffffff;
            font-size: 9px;
            font-weight: 800;
            padding: 3px 6px;
            border-radius: 4px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
            z-index: 10;
            pointer-events: none;
        }

        .avatar-img-wrapper {
            width: 100%;
            aspect-ratio: 1 / 1;
            border-radius: 8px;
            background-color: #ffffff;
            border: 1px solid #cbd5e1;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 6px;
            transition: all 0.2s ease;
        }

        .avatar-img-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .avatar-card.selected .avatar-img-wrapper {
            border: 3px solid #fba143;
            box-shadow: 0 0 0 4px rgba(251, 161, 67, 0.3);
            background-color: #fffaf0;
        }

        .avatar-name {
            font-size: 11px;
            font-weight: 600;
            color: #1f2937;
            text-align: center;
            width: 100%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .button-row {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 24px;
            margin-bottom: 16px;
        }

        .btn {
            padding: 12px 44px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
            min-width: 160px;
        }

        .btn-signup {
            background-color: transparent;
            border: 1.5px solid #374151;
            color: #1f2937;
        }

        .btn-signup:hover {
            background-color: rgba(55, 65, 81, 0.05);
        }

        .btn-next {
            background: linear-gradient(135deg, #fce0bc 0%, #f3c796 100%);
            border: none;
            color: #785835;
            box-shadow: 0 4px 12px rgba(232, 133, 36, 0.15);
            cursor: not-allowed;
        }

        .btn-next.active {
            background: linear-gradient(135deg, #fba143 0%, #e88524 100%);
            color: #1f2937;
            box-shadow: 0 4px 12px rgba(232, 133, 36, 0.3);
            cursor: pointer;
        }

        .btn-next.active:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(232, 133, 36, 0.4);
        }

        .missing-face-link {
            display: block;
            text-align: center;
            color: #e88524;
            font-weight: 700;
            font-size: 12px;
            text-decoration: underline;
            text-underline-offset: 3px;
            cursor: pointer;
            margin-top: 8px;
        }

        /* --- MODAL STYLES --- */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(17, 24, 39, 0.65);
            backdrop-filter: blur(5px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 3000;
            padding: 20px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .overlay.show {
            opacity: 1;
        }

        .loading-card {
            background: linear-gradient(90deg, #d3e5e0 0%, #f4ebd9 100%);
            border-radius: 16px;
            padding: 40px 48px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            max-width: 450px;
            width: 100%;
            border: none;
            z-index: 5005;
            position: relative;
        }

        .loading-card img {
            width: 80px;
            height: auto;
            margin-bottom: 24px;
            animation: pulse 1.2s infinite alternate ease-in-out;
            filter: drop-shadow(0 10px 15px rgba(0, 0, 0, 0.2));
        }

        .loading-card p {
            font-size: 16px;
            color: #111827;
            font-weight: 800;
            margin: 0;
            line-height: 1.5;
        }

        @keyframes pulse {
            0% {
                transform: scale(0.95);
            }

            100% {
                transform: scale(1.05);
            }
        }

        @media (max-width: 768px) {
            body {
                align-items: center;
                padding-left: 0;
            }

            .main-container {
                align-items: center;
            }

            .avatar-grid {
                grid-template-columns: repeat(5, 1fr);
            }

            .reg-card {
                padding: 24px 20px;
                max-height: 95vh;
            }

            .teacher-link {
                position: static;
                display: block;
                text-align: right;
                margin-bottom: 12px;
                margin-top: -10px;
            }
        }

        @media (max-width: 480px) {
            .avatar-grid {
                grid-template-columns: repeat(4, 1fr);
            }

            .button-row {
                flex-direction: column;
                gap: 12px;
            }

            .btn {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <!-- Fetching Roster Loading Modal -->
    <div id="rosterLoadingModal" class="overlay">
        <div class="loading-card">
            <img src="assets_reflect/hourglass.png" alt="Loading">
            <p>One moment please...<br>We are finding all the familiar faces.</p>
        </div>
    </div>

    <div class="main-container">
        <main class="reg-card">

            <a class="teacher-link" onclick="alert('Teacher login portal')">I'M A TEACHER</a>

            <div class="school-name">KENYA HIGH SCHOOL</div>

            <div class="card-header">
                <h1 class="card-title">Find your name.</h1>
                <p class="card-desc">If your name is not here yet, <a href="register.html" class="signup-link">click
                        here to sign-up</a>.</p>
            </div>

            <div class="search-container">
                <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <input type="text" class="search-input" id="searchInput" placeholder="Search by name"
                    onkeyup="filterAvatars()">
            </div>

            <div class="grid-scroll-container">
                <div class="avatar-grid" id="avatarGrid">
                </div>
            </div>

            <div class="button-row">
                <button type="button" class="btn btn-back" onclick="window.location.href='index.html'">GO BACK</button>
                <button type="button" class="btn btn-next" id="nextBtn" onclick="goToPasswordScreen()"
                    disabled>NEXT</button>
            </div>

            <a class="missing-face-link" onclick="alert('Help documentation: Contact your teacher.')">I CAN'T FIND MY
                FACE</a>

        </main>
    </div>

    <script>
        const GOOGLE_SHEET_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwTyvz2azkYILUbhFaWlQOZ454b9E_flwAlQ41cIhjacIfFop8Ter193nojY47uALI/exec";

        function sanitizeAvatar(imgUrl) {
            if (!imgUrl) return "new_user.png";
            if (imgUrl.startsWith("http") || imgUrl.startsWith("data:")) return imgUrl;
            if (imgUrl === "new_user.png") return imgUrl;

            if (imgUrl.startsWith("Avatar-") && !imgUrl.includes("/")) {
                return "assets_characters/" + imgUrl;
            }

            const fakeFaces = [
                "Aminate_Diallo.jpg", "Adeaze_Okafor.jpg", "Ibrahim_Touré.jpg",
                "Fatou_Bah.jpg", "Aïcha_Sow.jpg", "Kojo_Asante.jpg",
                "Mariame_Ca....jpg", "Tunde_Adeba.jpg", "Hadiza_Yusef.jpg",
                "Mary_Ezeno.jpg", "Ngozi_Okonko.jpg", "Salif_Konaté.jpg",
                "Yocouba_Sanou.jpg", "Akira_Nlovu.jpg", "Manzi_Kalisa.jpg",
                "Ihirwe_Uwera.jpg", "Kagame_Muhire.jpg", "Gapira_Uwase.jpg",
                "Gapira_Uwase-1.jpg", "Isimbi_Mugabo.jpg", "Kwame_Mens....jpg"
            ];
            if (fakeFaces.includes(imgUrl)) {
                return "assets_login/" + imgUrl;
            }

            return imgUrl;
        }

        const urlParams = new URLSearchParams(window.location.search);
        let newUserName = urlParams.get('newuser');
        let localAvatar = "new_user.png";

        const savedData = localStorage.getItem('wavumbuzi_user_data_complete');
        if (savedData) {
            try {
                const parsedData = JSON.parse(savedData);
                if (parsedData && parsedData.fullName && !newUserName) {
                    newUserName = parsedData.fullName;
                }
                if (parsedData && parsedData.avatar) {
                    localAvatar = sanitizeAvatar(parsedData.avatar);
                }
            } catch (e) { }
        }

        let selectedStudent = null;

        function formatName(name) {
            if (!name) return "";
            if (name.length > 12) return name.substring(0, 10) + "...";
            return name;
        }

        let students = [
            { name: "Aminate Diallo", img: "assets_login/Aminate_Diallo.jpg" },
            { name: "Adeaze Okafor", img: "assets_login/Adeaze_Okafor.jpg" },
            { name: "Ibrahim Touré", img: "assets_login/Ibrahim_Toure.jpg" },
            { name: "Fatou Bah", img: "assets_login/Fatou_Bah.jpg" },
            { name: "Aïcha Sow", img: "assets_login/Aicha_Sow.jpg" },
            { name: "Kojo Asante", img: "assets_login/Kojo_Asante.jpg" },
            { name: "Mariame Ca...", img: "assets_login/Mariame_Ca....jpg" },
            { name: "Tunde Adeba", img: "assets_login/Tunde_Adeba.jpg" },
            { name: "Hadiza Yusef", img: "assets_login/Hadiza_Yusef.jpg" },
            { name: "Mary Ezeno", img: "assets_login/Mary_Ezeno.jpg" },
            { name: "Ngozi Okonko", img: "assets_login/Ngozi_Okonko.jpg" },
            { name: "Salif Konaté", img: "assets_login/Salif_Konate.jpg" },
            { name: "Yocouba Sanou", img: "assets_login/Yocouba_Sanou.jpg" },
            { name: "Akira Nlovu", img: "assets_login/Akira_Nlovu.jpg" },
            { name: "Manzi Kalisa", img: "assets_login/Manzi_Kalisa.jpg" },
            { name: "Ihirwe Uwera", img: "assets_login/Ihirwe_Uwera.jpg" },
            { name: "Kagame Muhire", img: "assets_login/Kagame_Muhire.jpg" },
            { name: "Gapira Uwase", img: "assets_login/Gapira_Uwase.jpg" },
            { name: "Gapira Uwase 1", img: "assets_login/Gapira_Uwase-1.jpg" },
            { name: "Isimbi Mugabo", img: "assets_login/Isimbi_Mugabo.jpg" },
            { name: "Kwame Mensah", img: "assets_login/Kwame_Mens....jpg" }
        ];

        if (newUserName) {
            const exists = students.find(s => s.name.toLowerCase() === newUserName.toLowerCase());
            if (!exists) {
                students.push({
                    name: newUserName,
                    img: sanitizeAvatar(localAvatar),
                    isNewUser: true,
                    timestamp: new Date().toISOString() // Locally generated mock timestamp for immediate hoisting
                });
            } else {
                if (localAvatar && localAvatar !== "new_user.png") {
                    exists.img = sanitizeAvatar(localAvatar);
                }
            }
        }

        const gridContainer = document.getElementById('avatarGrid');

        function sortAndRenderStudents() {
            const now = new Date().getTime();
            const oneDay = 24 * 60 * 60 * 1000;

            students.sort((a, b) => {
                let aNew = false, bNew = false;

                if (a.timestamp) {
                    const aTime = new Date(a.timestamp).getTime();
                    if (!isNaN(aTime) && (now - aTime) < oneDay) aNew = true;
                }

                if (b.timestamp) {
                    const bTime = new Date(b.timestamp).getTime();
                    if (!isNaN(bTime) && (now - bTime) < oneDay) bNew = true;
                }

                if (aNew && !bNew) return -1;
                if (!aNew && bNew) return 1;

                return a.name.localeCompare(b.name);
            });

            gridContainer.innerHTML = '';

            students.forEach((student, index) => {
                const card = document.createElement('div');
                card.className = 'avatar-card';
                card.id = `student_${index}`;
                card.dataset.name = student.name.toLowerCase();

                const displayName = formatName(student.name);

                let isNew = false;
                if (student.timestamp) {
                    const sTime = new Date(student.timestamp).getTime();
                    if (!isNaN(sTime) && (now - sTime) < oneDay) {
                        isNew = true;
                    }
                }

                let badgeHtml = isNew ? `<div class="badge-new">NEW</div>` : '';

                card.innerHTML = `
                    ${badgeHtml}
                    <div class="avatar-img-wrapper">
                        <img src="${student.img}" alt="${student.name}" onerror="this.onerror=null; this.src='new_user.png';">
                    </div>
                    <div class="avatar-name" title="${student.name}">${displayName}</div>
                `;

                card.onclick = () => selectStudent(index, student.name);
                gridContainer.appendChild(card);
            });
        }

        function selectStudent(index, name) {
            document.querySelectorAll('.avatar-card').forEach(el => el.classList.remove('selected'));
            const selectedCard = document.getElementById(`student_${index}`);
            if (selectedCard) {
                selectedCard.classList.add('selected');
            }
            selectedStudent = name;

            const nextBtn = document.getElementById('nextBtn');
            nextBtn.disabled = false;
            nextBtn.classList.add('active');
        }

        function filterAvatars() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const cards = document.querySelectorAll('.avatar-card');

            cards.forEach(card => {
                const name = card.dataset.name;
                if (name.includes(query)) card.style.display = 'flex';
                else card.style.display = 'none';
            });
        }

        function goToPasswordScreen() {
            if (!selectedStudent) return;

            const studentObj = students.find(s => s.name === selectedStudent);
            const imgParam = studentObj && studentObj.img ? "&img=" + encodeURIComponent(studentObj.img) : "";

            const encodedName = encodeURIComponent(selectedStudent);
            window.location.href = "login_password.html?user=" + encodedName + imgParam;
        }

        function showLoadingModal() {
            const modal = document.getElementById('rosterLoadingModal');
            if (modal) {
                modal.style.display = 'flex';
                setTimeout(() => modal.classList.add('show'), 10);
            }
        }

        function hideLoadingModal() {
            const modal = document.getElementById('rosterLoadingModal');
            if (modal) {
                modal.classList.remove('show');
                setTimeout(() => modal.style.display = 'none', 300);
            }
        }

        function fetchRoster() {
            showLoadingModal();
            const fetchUrl = GOOGLE_SHEET_WEB_APP_URL + "?action=getRoster";
            fetch(fetchUrl)
                .then(response => response.json())
                .then(data => {
                    if (data.success && data.users) {
                        data.users.forEach(sheetUser => {
                            const sanitizedImg = sanitizeAvatar(sheetUser.avatar);
                            const exists = students.find(s => s.name.toLowerCase() === sheetUser.name.toLowerCase());

                            if (!exists) {
                                students.push({
                                    name: sheetUser.name,
                                    img: sanitizedImg,
                                    isNewUser: true,
                                    timestamp: sheetUser.timestamp // Expecting timestamp from App Script
                                });
                            } else {
                                if (sheetUser.avatar && sheetUser.avatar !== "new_user.png") {
                                    exists.img = sanitizedImg;
                                }
                                if (sheetUser.timestamp) {
                                    exists.timestamp = sheetUser.timestamp;
                                }
                            }
                        });

                        sortAndRenderStudents();
                    }
                    hideLoadingModal();
                })
                .catch(err => {
                    console.error("Error fetching roster from Google Sheets", err);
                    hideLoadingModal();
                });
        }

        window.addEventListener('DOMContentLoaded', () => {
            sortAndRenderStudents();
            fetchRoster();
        });
    </script>
</body>

</html>
